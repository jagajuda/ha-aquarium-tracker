# Aquarium Tracker configuration
# Location: /config/aquarium_tracker/tanks.yaml
# After editing: Aquarium panel -> "Config'i yeniden yükle", or call aquarium_tracker.reload
# Times must be quoted: "21:00"

settings:
  snooze_min: 60          # snooze length for the "Ertele" notification button
  default_temp_c: 25      # used for free-NH3 calculation when no temp is entered

# Global parameter list. Add single tests here later (e.g. K, Mg, SiO2).
parameters:
  NH4: {unit: mg/L}
  NO2: {unit: mg/L}
  NO3: {unit: mg/L}
  PO4: {unit: mg/L}
  Fe:  {unit: mg/L}
  Cu:  {unit: mg/L}
  pH:  {unit: ""}
  KH:  {unit: dKH}
  GH:  {unit: dGH}
  temp: {unit: "°C"}

tanks:
  big_tank:
    name: Big Tank
    net_volume_l: 105
    initial_mode: cycling            # mode is stored in the DB after the first start; change it from the panel
    stock_solutions:
      nh4cl:
        name: NH4Cl stock 10 g/100 mL
        compound: ammonium_chloride
        g_per_100ml: 10              # -> 33.7 mg NH4+/mL
    cycle:
      params: [NH4, NO2]
      required_passes: 2             # consecutive passing doses
      test_window_h: 24              # measurement must be within 24 h after the dose
      zero_threshold: 0
      verify_every_days: 1           # cycle task interval once the first pass is recorded
    tasks:
      cycle_test:
        title: Cycle test
        event: measurement
        params: cycle                # NH4 only until it reaches 0, then NH4 + NO2
        schedule: {type: interval, days: 2, at: "21:00"}
        reminder: {repeat_count: 3, repeat_interval_min: 60}
    # Future: log HA entity changes onto the timeline
    # watch_entities:
    #   - entity_id: light.big_tank_light
    #     label: light
    #     name: Light
    #     states: ["on", "off"]

  nano_tank:
    name: Nano Tank
    net_volume_l: 12
    initial_mode: maintenance
    fertilizers:
      trace:  {name: Reeflowers Trace,  default_dose: 3, unit: drops}
      potash: {name: Reeflowers Potash, default_dose: 3, unit: drops}
      power_caps: {name: Dennerle Power Caps, default_dose: 3, unit: tablets, prefill: false}  # prefill: false -> empty in a manual form
      nitrogen: {name: Seachem Flourish Nitrogen, unit: drops, prefill: false}  # dosed by the nitrogen program below
    water_change_default_percent: null
    # Each action is its own label on the timeline. Add more freely.
    maintenance_actions:
      filter_clean:    {name: Main filter clean}
      prefilter_clean: {name: Prefilter clean}
      glass_clean:     {name: Glass clean}
      trim:            {name: Trimming}
    # Measure-driven dosing. Start it from the panel (date picker); everything else follows the readings.
    dosing_programs:
      nitrogen:
        title: Nitrogen
        product: nitrogen
        parameter: NO3
        ml_per_drop: 0.05            # calibrate: weigh 40 drops of the product, grams / 40
        test_dose_ml: 0.5            # 10 drops; stays within the 0.5 mL daily cap (shrimp tank)
        response_h: 24
        label_per_ml_per_l: 30.3     # Seachem: 2.5 mL in 151 L shows +0.5 mg/L NO3 -> 30.3 per mL per litre
        kit_resolution: 1            # smaller test-dose rise -> use label k
        k_tolerance: 0.5             # measured k accepted within +-50% of label k
        target: 12                   # mg/L NO3
        ramp_max_ml_per_day: 0.5     # daily cap while raising to target (and for maintenance)
        maintenance_start_ml_per_day: 0.07   # label: 5 mL/250 L twice a week, scaled to 12 L per day
        bands:                       # applied to every NO3 reading in maintenance
          - {gt: 20, factor: 0.5}
          - {gt: 15, factor: 0.75}
          - {gte: 10, factor: 1.0}
          - {gte: 5, factor: 1.5}
          - {factor: 2.0}
        stable_band: [10, 15]
        stable_count: 3              # in-band readings in a row -> weekly measurement stops (monthly test continues)
        dose_at: "18:00"
        measure: {weekdays: [sat], at: "13:00"}   # before the water change
        reminder: {repeat_count: 3, repeat_interval_min: 60}
    tasks:
      water_change:
        title: Water change
        event: water_change
        schedule: {type: weekly, weekdays: [sat], at: "14:00"}
        early_window_h: 24           # a change logged from Friday 14:00 onward counts
        reminder: {repeat_count: 3, repeat_interval_min: 60}
      fertilize:
        title: Fertilize
        event: fertilize
        products: [trace, potash]    # only these complete the daily task (root tabs don't)
        schedule: {type: daily, at: "18:00"}
        early_window_h: 6
        reminder: {repeat_count: 2, repeat_interval_min: 60}
      root_tabs:
        title: Root tabs
        event: fertilize
        products: [power_caps]
        # every 3 calendar months after the last logged dose; first one on `start`
        schedule: {type: interval, months: 3, at: "14:00", start: "2026-11-29"}
        reminder: {repeat_count: 3, repeat_interval_min: 60}
      filter_maintenance:
        title: Filter maintenance
        event: maintenance
        rotate: [filter_clean, prefilter_clean]   # one per week, in turn; starts with the first if no history
        schedule: {type: weekly, weekdays: [sat], at: "14:00"}
        early_window_h: 24
        reminder: {repeat_count: 3, repeat_interval_min: 60}
      monthly_test:
        title: Full test kit
        event: measurement
        params: [NH4, NO2, NO3, pH, KH, GH, PO4, Fe, Cu]
        schedule: {type: monthly, weekday: sun, nth: 1, at: "11:00"}
        early_window_h: 48
        reminder: {repeat_count: 3, repeat_interval_min: 120}
